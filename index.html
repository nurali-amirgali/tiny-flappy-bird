<body style="margin:0;overflow:hidden">
<canvas id="c"></canvas>
<script>
const ctx = c.getContext('2d');
  c.width = innerWidth; 
  c.height = innerHeight;
  var velocity = 0;
  var gravity = -1.6;
  var terminalVelocity = -30;
  var flapForce = 18;
  var birdY = c.height*0.33;
  var birdX = (c.width * 0.2) - 30;

  var width = 60;
  var passedPoint = false;

  var pipeTimer = 0;
  var pipeDistance = 300;
  var numPipes = 10
  var pipeSpeed = 4

  var score = 0;
  var gameOver = true;
  var startScreen = true;

  var pipes = [];

  onresize = () => {c.width = innerWidth; c.height = innerHeight;};
  onmousedown = jump;
  onkeydown = keyDown;

  ctx.font = '100px monospace';
  ctx.strokeStyle = 'black';
  ctx.lineWidth = 4;
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / (1000 / 60), 3);
    last = now;
    ctx.fillStyle = 'cyan';
    ctx.fillRect(0, 0, c.width, c.height);

    drawRect(gameOver && !startScreen ? 'darkred' : 'white', birdX, birdY, 60, 60);

    ctx.fillStyle = 'black';
    ctx.fillRect(birdX+45, birdY+10, 10, 10);

    var inPoint = false;
    for (let i = pipes.length - 1; i >= 0; i--) { 
      const pipe = pipes[i];
      if (!gameOver){
        pipe[0] -= pipeSpeed * dt;
      }

      drawRect('lime', pipe[0], pipe[1], pipe[2], pipe[3]);
      if (pipe[0] + pipe[2] <= 0) {pipes.splice(i, 1);}
      if (birdX < (pipe[0] + pipe[2]) && (birdX + 60) > pipe[0]){
        inPoint = true;
        if (birdY < (pipe[1] + pipe[3]) && (birdY + 60) > pipe[1]){
          gameOver = true;
        }
      }
    }
    if (inPoint) {
      if (!passedPoint){
        passedPoint = true;
        score++;
      }
    }else{
      passedPoint = false;
    }

    if (birdY < 0 || (birdY + 60) > c.height){
      gameOver = true;
    }

    ctx.fillStyle = 'black';
    if (!gameOver){
      ctx.fillText(score, c.width/2 - 30, 70);
    }
    if (!gameOver){
      pipeSpeed = Math.min(0.0005 * dt + pipeSpeed, 10);
      birdY -= velocity * dt;
      velocity = Math.max(velocity + gravity * dt, terminalVelocity);
      pipeTimer += pipeSpeed * dt;
    }

    drawRect('lime',0, c.height*0.95, c.width, c.height-(c.height*0.95))

    ctx.fillStyle = 'green';
    if (gameOver){
      if (startScreen){
        ctx.fillText("click space to start", c.width * 0.1, c.height/2);
      }else{
        ctx.fillStyle = 'red';
        ctx.fillText("GAME OVER", c.width * 0.3, c.height*0.35);
        ctx.fillText("SCORE: " + score, c.width * 0.3, c.height*0.35 + 100);
        ctx.fillText("Click to restart", c.width * 0.17, c.height*0.35 + 200);
      }
    }

    if (pipeTimer >= pipeDistance){
      pipe();
      pipeTimer = 0;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function jump(){
    velocity = flapForce;
    if (gameOver){
      if (startScreen){
        gameOver = false;
        startScreen = false;
      }else{
        startScreen = true;
        score = 0;
        pipes = [];
        birdY = c.height*0.33;
      }
    }
  }

  function drawRect(color, x, y, width, height){
    ctx.fillStyle = color;
    ctx.fillRect(x,y,width,height);
    ctx.strokeRect(x,y,width,height);
  }

  function keyDown(e){
    if (e.key === ' ') {
      jump();
    }
  }

  function pipe(){
    let max = 170;
    let min = c.height-170;
    let gap = 250;
    let randomY = Math.floor(Math.random() * (max - min + 1)) + min;

    let topHeight = randomY - (gap/2);
    let bottomY = randomY + (gap/2);

    pipes.push([c.width, -10, width, topHeight+10]); //x, y, width, height
    pipes.push([c.width, bottomY, width, c.height - bottomY + 10]);
  }
</script>
